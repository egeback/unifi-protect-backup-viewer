# Example compose file. Copy/adjust for your own host — paths, the image
# tag, and the NVR mount source all depend on where UniFi Protect exports
# its NAS backup and how you're building/hosting the image.
name: unifi-protect-backup-viewer

services:
  unifi-protect-backup-viewer:
    build: .
    image: unifi-protect-backup-viewer:local
    container_name: unifi-protect-backup-viewer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Read-only mount of the UniFi-Protect_YYYY-MM-DD export folders.
      - /mnt/tank/nvr/UniFi:/nvr:ro
      - ./data:/data
      # Only needed for hardware (VAAPI) transcoding on an Intel iGPU.
      # Omit this and the group_add below if you don't have one — clips
      # will still work, just without hardware-accelerated transcoding.
      - /dev/dri:/dev/dri
    group_add:
      - "44"  # video   — match your host's `getent group video`
      - "107" # render  — match your host's `getent group render`
    env_file:
      - .env
    environment:
      TZ: UTC
